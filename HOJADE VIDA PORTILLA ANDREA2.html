        }

        .container {

        }

        /* Sidebar Styles */
        .sidebar {

        }

        }

            font-size: 14px;

            letter-spacing: 1px;
        }

        .contact-info, .external-links {

            padding: 0 10px;
        }

        .contact-item, .link-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .contact-item i, .link-item i {
            width: 25px;
            margin-right: 10px;
            font-size: 14px;
        }

        .link-item a {
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .link-item a:hover {
            color: #e0e0e0;
            text-decoration: underline;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            padding: 30px;
            background-color: white;
        }

        .section-header {
            color: #008080;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #008080;
            padding-bottom: 8px;
        }

            margin-bottom: 15px;
            text-align: justify;
        }

        .interests-list {
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .interests-list li {
            margin-bottom: 8px;
        }

        /* Portfolio Tabs */
        .tabs {
            display: flex;
            background-color: #008080;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 12px 0;
            background-color: #006666;
            color: white;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        .tab.active {
            background-color: #008080;
        }

        .tab:hover:not(.active) {
            background-color: #007070;
        }

        .tab-content {
            background-color: #f8f8f8;
            border: 1px solid #008080;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 20px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .year-section {
            margin-bottom: 20px;
        }

        .year-header {
            background-color: #e8f4f4;
            color: #006666;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .projects-list {
            padding-left: 20px;
        }

            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

                width: 100%;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab {
                flex: none;
                min-width: 50%;
            }
        }

        @media (max-width: 480px) {
            .tab {
                min-width: 100%;
            }
        }
    </style>
</head>

    <script>
        function showTab(tabName) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
